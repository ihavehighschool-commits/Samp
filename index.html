<head>

    <!-- นำเข้า Font สวยๆ และ Icon จาก FontAwesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', 'Kanit', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ใส่รูปพื้นหลังที่คุณเตรียมไว้ */
            background: url('https://cdn.discordapp.com/attachments/1485852091024150609/1526129388188598363/IMG-20260517-WA0002.jpg?ex=6a55e640&is=6a5494c0&hm=cc882119d71619a06a1db7fbbbc9de00d1189d18fce1a221f52dd82db730a744&') no-repeat center center fixed;
            background-size: cover;
            position: relative;
            padding: 20px;
        }

        /* Layer เคลือบพื้นหลังให้ดูซอฟต์และอ่านตัวอักษรง่ายขึ้น */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* การ์ดโปรไฟล์สไตล์โปร่งแสง (Glassmorphism) */
        .profile-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            animation: fadeIn 1s ease-in-out;
        }

        /* รูปโปรไฟล์ทรงกลม */
        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .avatar {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* กล่องข้อความ Quote กวนๆ */
        .quote-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 4px solid #ff4757;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-align: left;
            line-height: 1.6;
        }

        .quote-box p {
            color: #e0e0e0;
        }

        .quote-box .error-text {
            color: #ff4757;
            font-weight: 600;
            margin-top: 5px;
        }

        .section-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
            color: #ddd;
            font-weight: 300;
        }

        /* โซนปุ่มติดต่อทรงกลม */
        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-circle {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            font-size: 1.4rem;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* สีประจำปุ่มต่างๆ */
        .btn-email { background-color: #ea4335; }
        .btn-facebook { background-color: #1877f2; }
        .btn-whatsapp { background-color: #25d366; }
        .btn-line { background-color: #06c755; }

        /* เอฟเฟกต์เวลาเอาเมาส์ไปวาง (Hover) */
        .btn-circle:hover {
            transform: translateY(-5px) scale(1.08);
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            filter: brightness(1.1);
        }

        /* Animation ตอนโหลดหน้าเว็บ */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

</body>
</html>
