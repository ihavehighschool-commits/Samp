<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>LOGIN</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    width:100vw;
    height:100vh;

    background:
    linear-gradient(
        135deg,
        #0f0f0f,
        #1a0000,
        #300000
    );

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;
}

.card{

    width:420px;

    background:rgba(15,15,15,0.95);

    border:1px solid #ff0000;

    border-radius:15px;

    padding:35px;

    box-shadow:
    0 0 20px rgba(255,0,0,.3),
    0 0 60px rgba(255,0,0,.1);

}

.logo{

    text-align:center;

    color:#ff2a2a;

    font-size:42px;

    font-weight:bold;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#999;

    margin-bottom:30px;
}

input{

    width:100%;

    padding:14px;

    margin-bottom:15px;

    border:none;

    outline:none;

    border-radius:8px;

    background:#1d1d1d;

    color:white;
}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:8px;

    background:#cc0000;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.2s;
}

button:hover{

    background:#ff0000;
}

.footer{

    text-align:center;

    margin-top:15px;

    color:#777;
}

</style>
</head>
<body>

<div class="card">

    <div class="logo">SERVER RP</div>

    <div class="subtitle">
        Welcome Back
    </div>

    <input id="username" placeholder="Username">

    <input id="password"
           type="password"
           placeholder="Password">

    <button onclick="Login()">
        เข้าสู่ระบบ
    </button>

    <div class="footer">
        CEF LOGIN SYSTEM
    </div>

</div>

<script>

function Login()
{
    if(typeof cef !== "undefined")
    {
        cef.emit("LoginClick");
    }
    else
    {
        alert("CEF not found");
    }
}

</script>

</body>
</html>
